<!doctype html>
<html lang="fa" dir="rtl" class="no-js">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b0f">
    <meta name="description" content="سازوکار جهان؛ پاسخ‌های ساده، دقیق و تعاملی برای پرسش‌های کنجکاوانه.">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <script>document.documentElement.classList.replace('no-js', 'js')</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="page-loader" aria-hidden="true">
        <div class="loader-world"><span></span><i></i><i></i></div>
        <p>در حال چیدن جهان</p>
        <b>HOW IT WORKS</b>
    </div>
    <a class="skip-link" href="#main-content">رفتن به محتوای اصلی</a>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="site-header">
        <div class="container nav-wrap">
            <a class="brand" href="{{ url_for('home') }}" aria-label="صفحه اصلی سازوکار جهان">
                <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="brand-copy"><strong>سازوکار جهان</strong><small>HOW IT WORKS</small></span>
            </a>

            <button class="menu-button" type="button" aria-expanded="false" aria-controls="primary-nav">
                <span></span><span></span><span></span><span class="sr-only">باز کردن فهرست</span>
            </button>

            <nav id="primary-nav" class="primary-nav" aria-label="ناوبری اصلی">
                <a href="{{ url_for('home') }}#world">نقشه‌ی جهان</a>
                <a href="{{ url_for('home') }}#topics">موضوع‌ها</a>
                <a href="{{ url_for('home') }}#about">درباره</a>
                <a class="nav-cta" href="{{ url_for('topic', slug='why-sky-is-blue') }}"><span>کاوش کن</span><b aria-hidden="true">↙</b></a>
            </nav>
        </div>
    </header>

    <main id="main-content">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
        <div class="container footer-grid">
            <div>
                <a class="brand footer-brand" href="{{ url_for('home') }}">
                    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span class="brand-copy"><strong>سازوکار جهان</strong><small>HOW IT WORKS</small></span>
                </a>
                <p>برای آن‌هایی که هنوز می‌پرسند «چطور؟»</p>
            </div>
            <div class="footer-links">
                <a href="{{ url_for('home') }}#world">نقشه‌ی تعاملی</a>
                <a href="{{ url_for('home') }}#topics">همه‌ی موضوع‌ها</a>
                <a href="{{ url_for('article', slug='why-sky-is-blue') }}">مقاله‌ی ویژه</a>
            </div>
            <p class="copyright"><span>نسخه‌ی تعاملی ۰۳</span><span>ساخته‌شده برای کنجکاوی</span></p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
